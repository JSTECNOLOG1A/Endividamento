server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health para orquestrador / load balancer
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # API e uploads no mesmo origin (front usa paths relativos /api e /uploads)
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    client_max_body_size 32m;
  }

  location /uploads/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets do build (Vite) têm hash no nome do arquivo — mudam de URL a cada
  # deploy, então podem cachear "para sempre" sem risco de servir versão
  # antiga.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html NUNCA pode ser cacheado: é ele que referencia o nome com hash
  # do JS/CSS atual. Sem isso, o navegador pode reaproveitar uma cópia
  # antiga do HTML (sem Cache-Control explícito, fica sujeito a cache
  # heurística) e continuar carregando um bundle já substituído em
  # produção, mesmo depois de um deploy bem-sucedido.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
